<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><link rel="manifest" href="./manifest.webmanifest">
<title>Delivery Judge AI</title>
<style>
body{margin:0;background:#0b0b0c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#171719;border:1px solid #2a2a2e;border-radius:18px;padding:14px;margin:12px 0}
h1{font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{font:inherit}
input{width:100%;box-sizing:border-box;background:#0e0e10;color:#fff;border:1px solid #343439;border-radius:12px;padding:12px}
button,label.file{display:block;width:100%;box-sizing:border-box;border:0;border-radius:15px;padding:16px;font-weight:800;text-align:center}
.file{background:#2a2a2e}.file input{display:none}.primary{background:#fff;color:#111;margin-top:12px}
.secondary{background:#29292d;color:#fff}.preview{width:100%;max-height:420px;object-fit:contain;display:none;border-radius:14px;margin-top:12px}
.progress{height:7px;background:#2a2a2e;border-radius:20px;overflow:hidden;margin-top:10px;display:none}.bar{height:100%;width:0;background:#fff}
.status{text-align:center;color:#aaa;font-size:13px;margin-top:8px}.result{text-align:center;font-size:44px;font-weight:900}
.small{color:#999;font-size:12px;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#101012;border-radius:12px;padding:10px;text-align:center}.metric small{color:#999}.metric b{display:block;font-size:18px;margin-top:4px}
.hidden{display:none}
</style></head><body><div class="wrap">
<h1>Delivery Judge AI</h1><div class="small">高速OCR版 v0.3</div>
<div class="card">
<label class="file">オファー画像を選ぶ<input id="f" type="file" accept="image/*"></label>
<img id="p" class="preview"><div id="prog" class="progress"><div id="bar" class="bar"></div></div><div id="st" class="status"></div>
<button id="ocr" class="primary">すぐ判定</button><div class="small" style="margin-top:8px">画像を縮小し、英数字中心で読む高速版です。</div>
</div>
<div id="res" class="card hidden"><div id="dec" class="result"></div><div class="metrics">
<div class="metric"><small>円/分</small><b id="a"></b></div><div class="metric"><small>時給換算</small><b id="b"></b></div><div class="metric"><small>円/km</small><b id="c"></b></div></div></div>
<div class="card"><div class="grid"><input id="pay" type="number" placeholder="報酬 647"><input id="min" type="number" placeholder="時間 26"></div>
<div class="grid" style="margin-top:10px"><input id="km" type="number" step="0.1" placeholder="距離 8.4"><button id="judge" class="secondary">判定</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=x=>document.getElementById(x);let file=null;
$("f").onchange=e=>{file=e.target.files[0];if(file){$("p").src=URL.createObjectURL(file);$("p").style.display="block"}};
function resize(file){return new Promise((ok,no)=>{let i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{let s=Math.min(1,1100/i.width),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},"image/jpeg",.82)};i.onerror=no;i.src=u})}
$("ocr").onclick=async()=>{if(!file)return alert("先に画像を選んでください");$("ocr").disabled=true;$("ocr").textContent="高速読取中…";$("prog").style.display="block";$("st").textContent="画像を軽量化しています";
try{let img=await resize(file);$("st").textContent="数字を読み取っています";
let r=await Promise.race([Tesseract.recognize(img,"eng",{logger:m=>{if(m.progress!=null)$("bar").style.width=Math.round(m.progress*100)+"%"}}),new Promise((_,rej)=>setTimeout(()=>rej("timeout"),45000))]);
let t=r.data.text.replace(/,/g,"").replace(/O/g,"0");let p=t.match(/¥\s*([0-9]{2,6})/i),m=t.match(/([0-9]{1,3})\s*(?:min|m)/i),k=t.match(/([0-9]+(?:\.[0-9]+)?)\s*km/i);
if(p)$("pay").value=p[1];if(m)$("min").value=m[1];if(k)$("km").value=k[1];run();$("st").textContent="読み取り完了";
}catch(e){$("st").textContent="";alert("45秒以内に読めませんでした。回線が遅い場合は手入力を使ってください。")}
finally{$("ocr").disabled=false;$("ocr").textContent="すぐ判定";setTimeout(()=>$("prog").style.display="none",500)}};
$("judge").onclick=run;
function run(){let p=+$("pay").value,m=+$("min").value,k=+$("km").value;if(!p||!m)return alert("報酬と時間を入力してください");let y=p/m,h=y*60,yk=k?p/k:0,s=50;
s+=y>=25?25:y>=20?8:-20;if(k){s+=k<=5?10:k<=8?2:k>=10?-18:-8;s+=yk>=150?10:yk<90?-10:0}
let d=s>=70?"🟢 取る":s>=50?"🟡 条件付き":"🔴 見送り";$("dec").textContent=d;$("a").textContent=y.toFixed(1);$("b").textContent=Math.round(h)+"円";$("c").textContent=k?Math.round(yk):"—";$("res").classList.remove("hidden");$("res").scrollIntoView({behavior:"smooth"})}
</script></body></html>
